[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bridge-ai"
version = "0.0.1"
description = "Open-source contract bridge AI covering bidding and card play"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
bidding = ["numpy>=1.24"]  # neural bidding (bridge_ai.bidding)
dev = ["pytest>=8", "numpy>=1.24"]
verify = ["endplay>=0.5"]  # reference DDS build used by scripts/verify_dds.py

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
